name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore

      # TESTCONTAINERS_RYUK_DISABLED: o Ryuk e um container auxiliar que o Testcontainers
      # puxa do Docker Hub UMA VEZ por execucao para faxinar containers orfaos ao final.
      # Num runner efemero ele nao tem funcao: a VM inteira e destruida junto com o job,
      # entao nao ha orfao para limpar. O que ele tem e custo: vira ponto unico de falha
      # para TODA a suite de integracao. Em 2026-08-24 o Docker Hub devolveu HTTP 500 ao
      # servir o manifesto dele e, no operacoes, 163 dos 208 testes de API quebraram juntos em
      # 9,8s — inclusive os de Postgres, que nada tem a ver com o relay. A mesma falha ja
      # tinha acontecido numa maquina local, com o container do Ryuk preso em "Created",
      # com exatamente o mesmo placar 163/45.
      # Fica ligado no desenvolvimento local (onde a maquina persiste e a faxina serve);
      # aqui e desligado de proposito.
      - name: Testes (com cobertura)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./test-results/coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Coverage gate (line >= 85%)
        run: python3 scripts/coverage-gate.py ./test-results/coverage --threshold 85 --verbose

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Gate barato (segundos): docker-compose.prod.yml exige ${CUSTODIA_APP_PASSWORD:?...}
      # e ${CUSTODIA_API_KEY:?...} (sem default em produção, de propósito). Este bloco env:
      # é a ÚNICA fonte das obrigatórias aqui — o runner não tem `.env` (não é versionado);
      # sem estas dummies o `config -q` do docker-compose.prod.yml abaixo falha e o job
      # `test` reprova (mesma armadilha documentada no molde
      # ../tesouro-direto-api/.github/workflows/deploy.yml para TD_APP_PASSWORD: o bug não
      # aparece em teste local porque `docker compose` lê o `.env` do diretório
      # automaticamente e mascara a variável faltante — para reproduzir a condição do CI use
      # `--env-file /dev/null`).
      #
      # AS DUMMIES TÊM QUE ESPELHAR EXATAMENTE as variáveis `:?` dos composes — nem a mais,
      # nem a menos. Uma a menos e o `config -q` reprova; uma a mais e ninguém percebe que
      # sobrou, até alguém concluir do CI que o serviço depende de algo que ele não usa.
      # `Hub__*` e `RabbitMq__*` NÃO estão nos composes desta fase — entram na fase que os
      # tornar reais (ver o bloco "VARIAVEIS QUE AINDA NAO ESTAO AQUI" no
      # docker-compose.prod.yml) — então também não estão aqui.
      - name: Compose config gate (sintaxe + tags existem no registry)
        env:
          CUSTODIA_APP_PASSWORD: dummy
          CUSTODIA_API_KEY: dummy
        run: |
          set -e
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q

          images=$(docker compose -f docker-compose.yml config --format json \
            | jq -r '.services[] | select(.build == null) | .image' | sort -u)

          failed=0
          for image in $images; do
            if output=$(docker manifest inspect "$image" 2>&1); then
              echo "OK    $image"
            elif echo "$output" | grep -qiE 'no such manifest|manifest unknown|not found'; then
              echo "FALHA $image (tag inexistente no registry)"
              echo "$output"
              failed=1
            else
              echo "AVISO $image: falha ao consultar o manifest (ignorado)"
              echo "$output"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Gate reprovado: pelo menos uma tag pinada não existe no registry."
            exit 1
          fi

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # A parada em erro vem do `set -e` na primeira linha do script, NAO de
          # `script_stop: true`: esse input foi removido do appleboy/ssh-action, e o tag
          # flutuante `@v1` ja aponta para uma versao que nao o conhece — o run anota
          # "Unexpected input(s) 'script_stop'" e segue. Ele estava aqui sem efeito
          # nenhum. Ver LEIA-ME-KIT.md, "Guarda que sumiu junto com um tag flutuante".
          # RABBITMQ_USER/RABBITMQ_PASSWORD sao credencial usada SO por este script de
          # deploy (a declaracao de topologia abaixo) — nao entram em nenhum compose,
          # entao entram em DUAS listas (esta e o `env:` do MESMO step logo abaixo),
          # nao nas cinco do PADROES §10.33 (o criterio de lá: "credencial usada só
          # pelo script de deploy entra em DUAS"). Quando o consumidor de eventos
          # existir e RabbitMq__User/Password entrarem nos composes com `:?`, ESSAS
          # (mesmo nome, papel diferente) passam a exigir as cinco.
          envs: CUSTODIA_APP_PASSWORD,CUSTODIA_API_KEY,RABBITMQ_USER,RABBITMQ_PASSWORD
          script: |
            set -e
            REPO_DIR=/opt/custodia
            mkdir -p "$REPO_DIR"
            cd "$REPO_DIR"

            echo "== preflight =="
            docker network inspect tesouro-net >/dev/null 2>&1 || {
              echo "ERRO: rede docker 'tesouro-net' não existe. O compose do tesouro-direto a cria;"
              echo "sem ela o custodia subiria numa rede isolada e não enxergaria o Postgres."
              docker network ls
              exit 1
            }
            # "plataforma" é diferente de "tesouro-net": é a rede da PLATAFORMA (custodia
            # não é dono dela), criada aqui na primeira vez que qualquer serviço precisar
            # dela — hoje é o plataforma-rabbitmq do Hub. A custodia entra nela desde já
            # porque vai consumir eventos desse broker (§9 item 3). Por ser
            # external:true no compose, o "up" abortaria se ela não existisse; diferente
            # de tesouro-net, aqui não há por que abortar o deploy — criar é seguro e
            # idempotente (docker network create falha alto se já existir e o inspect
            # acima já filtrou esse caso).
            docker network inspect plataforma >/dev/null 2>&1 || {
              echo "rede docker 'plataforma' não existe nesta VPS ainda — criando."
              docker network create plataforma
            }
            docker ps --format '{{.Names}}' | grep -qx tesouro-direto-db || {
              echo "ERRO: container 'tesouro-direto-db' não está rodando — é o Postgres compartilhado (§12 do plano)."
              docker ps --format '  {{.Names}}'
              exit 1
            }
            echo "preflight ok"

            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi
            git fetch origin main
            git reset --hard origin/main

            CUSTODIA_APP_PASSWORD="$(printf '%s' "$CUSTODIA_APP_PASSWORD" | tr -d '\r\n')"
            if [ -z "$CUSTODIA_APP_PASSWORD" ]; then
              echo "ERRO: secret CUSTODIA_APP_PASSWORD vazio (ou só com quebras de linha)."
              exit 1
            fi

            CUSTODIA_API_KEY="$(printf '%s' "$CUSTODIA_API_KEY" | tr -d '\r\n')"
            if [ -z "$CUSTODIA_API_KEY" ]; then
              echo "ERRO: secret CUSTODIA_API_KEY vazio (ou só com quebras de linha). É a chave que o"
              echo "      custodia exige de quem o chama (X-Api-Key); sem ela o container sobe e o"
              echo "      ApiKeyGuard derruba o boot em ambiente Production."
              exit 1
            fi

            # SECRETS QUE AINDA NAO SAO VALIDADOS AQUI: Hub__* e RabbitMq__*. Eles nao estao
            # nos composes desta fase, entao nao entram no .env — e validar secret que
            # ninguem consome so cria motivo de reprovar deploy sem causa. Ao acrescenta-los,
            # normalize na ORIGEM com `tr -d '\r\n'` (§10.4), como as duas acima, E lembre
            # de incluir nas CINCO listas (PADROES §10.33): os dois composes, o `envs:`
            # do ssh-action, o `env:` do MESMO step (de onde vem o valor — esquecer esta
            # encaminha uma variavel INEXISTENTE, que chega aqui como string vazia e o
            # `-z` abaixo acusaria "secret vazio" com o secret certo cadastrado no
            # GitHub), o printf do .env abaixo, e as dummies do config gate.

            # ATENÇÃO: este .env é reescrito POR COMPLETO a cada deploy — não é um merge com
            # o que já existe na VPS. Qualquer variável obrigatória (${VAR:?...} no compose)
            # que não entrar neste MESMO printf derruba o serviço no próximo "up", mesmo que
            # a variável já tivesse valor num .env anterior. Já houve incidente neste
            # ecossistema com um script sobrescrevendo o .env com só parte das variáveis e
            # reportando sucesso — as obrigatórias têm que estar juntas aqui.
            printf 'CUSTODIA_APP_PASSWORD=%s\nCUSTODIA_API_KEY=%s\n' \
              "$CUSTODIA_APP_PASSWORD" "$CUSTODIA_API_KEY" > .env
            chmod 600 .env

            echo "== provisionamento do banco =="
            ./infra/postgres/provision-remote.sh

            echo "== guarda de colisão de alias em redes compartilhadas =="
            # Exclui só custodia-app: este compose sobe um único serviço, sem broker
            # próprio. O broker plataforma-rabbitmq é da PLATAFORMA, sobe no hub-precos, nunca
            # aqui.
            outros=$(docker ps --format '{{.Names}}' | grep -vx -e custodia-app || true)
            servicos=$(CUSTODIA_APP_PASSWORD=dummy CUSTODIA_API_KEY=dummy \
              docker compose -f docker-compose.prod.yml config --services)
            for rede in tesouro-net plataforma; do
              if ! docker network inspect "$rede" >/dev/null 2>&1; then
                echo "  '$rede': rede ainda não existe nesta VPS, pulando checagem de colisão."
                continue
              fi

              alheios=$(for c in $outros; do
                docker inspect -f '{{range $n,$v := .NetworkSettings.Networks}}{{if eq $n "'"$rede"'"}}{{range $v.Aliases}}{{.}}{{"\n"}}{{end}}{{end}}{{end}}' "$c" 2>/dev/null
              done | sort -u | grep -v '^$' || true)

              for s in $servicos; do
                if echo "$alheios" | grep -qx "$s"; then
                  echo "ERRO: o serviço '$s' colide com um alias DNS já registrado na rede $rede"
                  echo "      por outro container. Subir assim faria o DNS do Docker alternar entre os"
                  echo "      dois, quebrando METADE das chamadas de ambos os lados, sem erro visível."
                  echo "      Renomeie o serviço em docker-compose.prod.yml para algo único na rede."
                  echo "      Aliases já registrados por terceiros em '$rede':"
                  echo "$alheios" | sed 's/^/        /'
                  exit 1
                fi
              done
              echo "  '$rede': sem colisão"
            done
            echo "sem colisão"

            echo "== build e up =="
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "== declarando e verificando a topologia RabbitMQ do lado consumidor (F2) =="
            # ATE O F2, este comentario dizia "NAO HA AQUI verificacao de credencial do
            # broker nem smoke test de relay" — porque o molde `operacoes` PUBLICA na
            # outbox e a custodia so CONSOME (ADR-10), e nesta fase nem broker usava. O
            # F2 fecha essa lacuna: a prova equivalente aqui NAO e credencial+smoke do
            # relay, e sim que a fila e os bindings do CONSUMIDOR existem ANTES da
            # primeira publicacao — evento em exchange topic sem binding casando e
            # descartado EM SILENCIO, com o produtor marcando sucesso (ja aconteceu
            # nesta plataforma — LEIA-ME-KIT, "Perder o volume do broker apaga fila e
            # binding"). infra/rabbitmq/declare-topology.sh declara (idempotente) e
            # verifica (bloqueante, com prova de fumaca por delta) a topologia da
            # ARQUITETURA §5 pelo lado consumidor: exchange `prices`, fila
            # `custodia.prices` com os quatro bindings, e a infraestrutura de
            # DLQ/parking/retry que a Decisao A do F4 vai precisar.
            #
            # DESFECHO ASSIMETRICO (LEIA-ME-KIT, "Reprovar o proprio deploy por causa de
            # um servico que nao e seu"; PADROES §10.15): o script devolve o exit code
            # 11 SOMENTE quando o broker nao respondeu apos o laco de espera — o
            # `plataforma-rabbitmq` e servico do hub-precos, nao deste repositorio, e um
            # `exit 1` aqui faria o job `guarda-deploy` (PADROES §10.17) afirmar "este
            # commit NAO chegou a producao" com o container custodia-app healthy de
            # verdade. QUALQUER outro exit code REPROVA — mas NEM TODOS SAO NOSSOS: o 13
            # (exchange `prices` divergente) e o 19 (policy de terceiro) reprovam APESAR
            # de a correcao estar no repo do dono do broker. Isso nao contradiz o
            # LEIA-ME-KIT: a pergunta "a culpa e deste repositorio?" decide entre avisar e
            # reprovar SO enquanto o estado permanece integro. Broker inacessivel deixa
            # tudo integro — segue. Invariante quebrado faria o deploy prosseguir sobre
            # uma premissa FALSA — reprova, e a mensagem diz onde esta a correcao.
            # E nem todo caso tem a MESMA acao corretiva, entao o `case` abaixo tem
            # ramos proprios para os que precisam de uma acao diferente de "reexecute":
            # 17 (EXIT_FERRAMENTA) e falha da NOSSA ferramenta de deploy (imagem do
            # curl/jq, rede docker local, daemon, ou DNS que nao resolve) — reexecutar
            # PODE resolver, se a causa for transiente; 18 (EXIT_LIMPEZA_INSEGURA) e
            # DANO JA CONSUMADO (a limpeza de uma mensagem de prova removeu algo que
            # nao era a prova) — reexecutar NAO ajuda, percorre o MESMO caminho
            # destrutivo, e o que falta e investigacao manual; 19
            # (EXIT_POLICY_DE_TERCEIRO) e uma policy do broker (do hub-precos)
            # envenenando uma das nossas filas — a correcao e no repo dele, reexecutar
            # aqui so repete o mesmo 19 para sempre enquanto a policy existir. Os
            # demais (401 da credencial, fila/binding ausente, exchange `prices`
            # divergente, prova de fumaca/fanout/retry falhando) caem no `*)` generico.
            #
            # A LEGITIMIDADE DO `::warning::` ABAIXO DEPENDE DE UMA REGRA QUE ESTE
            # REPOSITORIO NAO PUBLICA. A regra `custodia-topologia-ausente` ESTA neste
            # commit (infra/grafana/cloud/rules-custodia.yaml), mas a copia EFETIVA vive
            # em ../tesouro-direto-api/infra/grafana/cloud/rules-custodia.yaml e so chega
            # a nuvem pelo apply-cloud.sh de la — editar so a daqui deixa a regra
            # existindo no repo e NAO existindo na nuvem, em silencio (LEIA-ME-KIT,
            # "Publicar alerta na nuvem: as duas copias, o valor do token, e a prova pela
            # API"). Ela e ancorada em
            # absent(rabbitmq_detailed_queue_messages_ready{vhost="/",queue="custodia.prices"}).
            # NAO ha contraste entre "detailed" e "coarse": `queue_coarse_metrics` e o
            # nome da FAMILIA dentro do endpoint `/metrics/detailed`, e e essa familia que
            # o alloy raspa. O contraste real e com o `/metrics` DEFAULT, onde a serie vem
            # agregada e SEM o label `queue` — por isso o seletor nao pode usar
            # `rabbitmq_queue_messages_ready`. Ver o comentario correspondente em
            # ../tesouro-direto-api/infra/alloy/config.alloy.
            # A regra cobre o intervalo entre este deploy e o proximo enquanto o broker
            # estiver fora. SEM ela publicada na nuvem, um blip transitorio do broker
            # deixaria a topologia por declarar com o deploy inteiro verde e NENHUM
            # sinal — a mesma janela de perda que este passo existe para fechar. Se um
            # dia essa regra for removida sem que este comentario seja atualizado, quem
            # ler isto tem que saber: SEM ela, a linha abaixo tem que virar REPROVA
            # (trocar o `echo "::warning::..."` por `exit 1`), nao silenciosamente
            # continuar avisando para o vazio.
            set +e
            RABBITMQ_USER="$RABBITMQ_USER" RABBITMQ_PASSWORD="$RABBITMQ_PASSWORD" \
              ./infra/rabbitmq/declare-topology.sh
            rabbitmq_topologia_status=$?
            set -e
            case "$rabbitmq_topologia_status" in
              0)
                echo "    topologia RabbitMQ declarada e verificada"
                ;;
              11)
                echo "::warning::plataforma-rabbitmq inacessivel apos o laco de espera — topologia NAO declarada/verificada neste deploy. Servico do hub-precos, nao deste repositorio; cobertura em runtime pela regra custodia-topologia-ausente."
                echo "AVISO: plataforma-rabbitmq inacessivel apos o laco de espera do script de"
                echo "      topologia. O deploy do custodia PROSSEGUE (o container e valido e vai"
                echo "      subir healthy independentemente deste broker); a regra"
                echo "      custodia-topologia-ausente cobre o cenario 'fila custodia.prices nao"
                echo "      existe' em runtime, ate o proximo deploy redeclarar."
                ;;
              17)
                echo "ERRO: falha da NOSSA ferramenta de deploy (exit code 17 = EXIT_FERRAMENTA)."
                echo "      Ver a saida acima: imagem do curl/jq que nao pode ser puxada, rede"
                echo "      docker local ausente, o daemon docker com problema, ou"
                echo "      RABBITMQ_MANAGEMENT_HOST que nao resolve na rede docker (curl exit 6)."
                echo "      Isto NAO e diagnostico de broker nenhum."
                exit 1
                ;;
              18)
                echo "ERRO: LIMPEZA INSEGURA (exit code 18 = EXIT_LIMPEZA_INSEGURA) — a limpeza de"
                echo "      uma mensagem de prova deste script REMOVEU DA FILA algo que NAO ERA a"
                echo "      prova. Ver o payload removido na saida acima."
                echo "      NAO REEXECUTE O DEPLOY antes de investigar manualmente: reexecutar"
                echo "      percorre o MESMO caminho destrutivo desta verificacao, e o dano ja"
                echo "      esta consumado (uma mensagem real foi destruida) — reexecutar nao"
                echo "      desfaz isso e pode repetir contra outra mensagem."
                exit 1
                ;;
              19)
                echo "ERRO: POLICY DE TERCEIRO (exit code 19 = EXIT_POLICY_DE_TERCEIRO) — ver a"
                echo "      saida acima para o nome da policy/operator policy e as chaves que ela"
                echo "      aplica sobre uma das nossas filas."
                echo "      A CORRECAO E NO REPO DONO DO BROKER (hub-precos), NAO aqui — reexecutar"
                echo "      este deploy sem corrigir la repete o mesmo 19 para sempre, porque a"
                echo "      causa nao esta neste repositorio."
                exit 1
                ;;
              *)
                echo "ERRO: declaracao/verificacao da topologia RabbitMQ falhou (exit code ${rabbitmq_topologia_status})."
                echo "      Isto e NOSSO e acionavel: ver a saida acima (RABBITMQ_USER/RABBITMQ_PASSWORD"
                echo "      ausente ou vazio apos normalizar — exit 1 do proprio script, PADROES §10.33;"
                echo "      401 de credencial; fila ou binding ausente; exchange 'prices' divergente; ou"
                echo "      prova de fumaca/fanout/retry falhando)."
                exit 1
                ;;
            esac

            echo "== esperando ficar healthy =="
            timeout 300 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" custodia-app 2>/dev/null)" = "healthy" ]; do
              sleep 5
            done' || {
              echo "ERRO: container não ficou healthy. Últimas linhas do log:"
              docker logs --tail 50 custodia-app || true
              exit 1
            }

            echo "== smoke test autenticado (CUSTODIA_API_KEY realmente autentica) =="
            # Prova equivalente, sem depender de rota nenhuma: um caminho
            # QUALQUER sob /v1/ tem que responder 401 SEM chave (o ApiKeyMiddleware está
            # ativo) e 404 COM a CUSTODIA_API_KEY provisionada (autenticado, mas a rota não
            # existe). As duas juntas provam o fato — só o 401 não provaria nada, porque
            # passaria também com a chave errada.
            unauthenticated_status=$(docker exec custodia-app curl -sS -o /dev/null -w '%{http_code}' \
              http://localhost:8080/v1/smoke-inexistente)
            if [ "$unauthenticated_status" != "401" ]; then
              echo "ERRO: GET /v1/smoke-inexistente SEM chave não retornou 401 (retornou"
              echo "      $unauthenticated_status). Isso significa que a autenticação por API key"
              echo "      não está ativa e o deploy subiria servindo /v1/* sem exigir credencial."
              docker logs --tail 50 custodia-app || true
              exit 1
            fi
            echo "    sem chave: 401 ok"

            authenticated_status=$(docker exec custodia-app curl -sS -o /dev/null -w '%{http_code}' \
              -H "X-Api-Key: $CUSTODIA_API_KEY" http://localhost:8080/v1/smoke-inexistente)
            if [ "$authenticated_status" != "404" ]; then
              echo "ERRO: GET /v1/smoke-inexistente com a CUSTODIA_API_KEY provisionada não retornou"
              echo "      404 (retornou $authenticated_status). Rota inexistente autenticada deveria"
              echo "      passar pelo ApiKeyMiddleware e cair no roteamento sem endpoint — 401 aqui"
              echo "      significaria que a chave do secret CUSTODIA_API_KEY diverge da chave que a"
              echo "      aplicação está aceitando."
              docker logs --tail 50 custodia-app || true
              exit 1
            fi
            echo "    com CUSTODIA_API_KEY: 404 ok (autenticado, rota inexistente)"

            echo "== deploy concluído =="
            docker image prune -f
        env:
          CUSTODIA_APP_PASSWORD: ${{ secrets.CUSTODIA_APP_PASSWORD }}
          CUSTODIA_API_KEY: ${{ secrets.CUSTODIA_API_KEY }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}

  guarda-deploy:
    # PADROES §10.17: o `deploy` depende do `test`; um teste instável pula o deploy em
    # silêncio, e nada na leitura casual do histórico distingue "nunca deployado" de
    # "deployado" — foi assim que um PR ficou 12 dias mergeado e fora do ar. Este job
    # roda SEMPRE (mesmo se `test`/`deploy` falharem ou forem pulados) só em push na
    # main, e falha ALTO quando o deploy não aconteceu de fato — o commit fica com um
    # check vermelho e nomeado, em vez de um "skipped" cinza fácil de não notar numa
    # lista de checks.
    if: always() && github.event_name == 'push'
    needs: [test, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Confere que este commit da main chegou a produção
        run: |
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "ERRO: push em main no commit ${{ github.sha }} NÃO chegou a produção"
            echo "      (test: ${{ needs.test.result }}, deploy: ${{ needs.deploy.result }})."
            echo "      Corrija e mande um novo push — reveja PADROES.md §10.17."
            exit 1
          fi
          echo "commit ${{ github.sha }} deployado com sucesso."
