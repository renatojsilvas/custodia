apiVersion: 1
groups:
  - orgId: 1
    name: custodia-alertas
    folder: Custodia
    interval: 1m
    rules:
      - uid: custodia-app-down
        title: Custodia — App down (target não respondendo)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __DS_PROM__
            model:
              expr: up{job="custodia"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: eq
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: O Prometheus não está conseguindo fazer scrape do target custodia
          description: >-
            Mesma forma de td-app-down (repo tesouro-direto-api, rules.yaml): up==0, não
            absent(), porque o alvo já está declarado em infra/alloy/config.alloy
            (prometheus.scrape "custodia") e o que este alerta vigia é ele parar de
            responder, não sumir do config. noDataState=Alerting de propósito: se a
            série inteira desaparecer (alvo removido do scrape, container renomeado, ou
            o próprio Alloy fora do ar), isso também precisa soar — ausência de dado não
            pode ser lida como "está tudo bem". Verifique primeiro se o container
            custodia-app está de pé na VPS (docker ps), depois os logs do container
            tesouro-direto-alloy (ele é quem faz o scrape), e por fim se o alvo
            custodia-app:8080/metrics responde de dentro da rede tesouro-net.
        labels:
          severity: critical
          service: custodia
        isPaused: false
      - uid: custodia-outbox-backlog-velho
        title: Custodia — Backlog da outbox envelhecido
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __DS_PROM__
            model:
              expr: max(custodia_outbox_pendente_mais_antiga_segundos{job="custodia"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 900
                    type: gt
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Mensagem mais antiga da outbox pendente há mais de 15 minutos
          description: >-
            Mesma forma de hub-outbox-backlog-velho (repo hub-precos, rules.yaml): idade
            (custodia_outbox_pendente_mais_antiga_segundos), não contagem
            (custodia_outbox_pendentes) de propósito — backlog transitório é normal (o
            relay drena a cada 5s, Outbox:Relay:IntervaloSegundos), backlog VELHO é o
            sintoma real. 15 minutos (900s) é folga generosa sobre essa cadência: uma
            mensagem só fica velha se algo está impedindo o dreno, não por variação
            normal de carga. noDataState=Alerting de propósito: esta métrica só é
            gravada em RelayOutboxJob quando o ciclo termina com sucesso; ausência
            prolongada dela significa que o relay nunca conseguiu ler o backlog desde o
            boot — app fora do ar ou Postgres inacessível — e isso precisa soar, não
            calar. Se este alerta disparar com custodia-relay-falha-persistente também
            firing, o problema é o broker plataforma-rabbitmq ou o Postgres
            compartilhado; se disparar sozinho, o relay está lendo mas não drenando na
            velocidade necessária (TamanhoLote/MaxLotesPorCiclo pequenos demais para o
            volume, ou publish lento). Verifique os logs do container custodia-app para
            o RelayOutboxJob e o painel "Ciclos de relay por desfecho". Diferente do
            hub-precos, este backlog nasce quase sempre vazio em operação normal — se
            ele nunca esteve vazio desde o deploy, suspeite primeiro de credencial do
            broker divergente (ver o step de verificação de credencial no deploy, em
            .github/workflows/ci.yml).
        labels:
          severity: critical
          service: custodia
        isPaused: false
      - uid: custodia-relay-falha-persistente
        title: Custodia — Relay outbox falhando persistentemente
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __DS_PROM__
            model:
              expr: increase(custodia_relay_ciclos_total{job="custodia",outcome="failure"}[5m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 30
                    type: gt
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Mais de 30 ciclos de relay da outbox falharam nos últimos 5 minutos
          description: >-
            Mesma forma de hub-relay-falha-persistente (repo hub-precos, rules.yaml). O
            relay roda a cada 5s (Outbox:Relay:IntervaloSegundos), até 60 ciclos
            possíveis em 5m; 30 é metade. Esta regra existe porque o alerta de idade do
            backlog (custodia-outbox-backlog-velho) NÃO pega todo cenário: quando o
            próprio ciclo falha (ex.: plataforma-rabbitmq fora do ar ou inalcançável pela
            rede "plataforma", ou Postgres compartilhado inacessível ao ler pendentes),
            RelayOutboxJob só registra o desfecho "failure" — o gauge de idade do
            backlog não é atualizado nesse caminho, então ele CONGELA no último valor
            bom em vez de crescer, e pode ficar abaixo do threshold de idade por um bom
            tempo. noDataState=OK porque o desfecho do ciclo é registrado
            incondicionalmente a cada execução (sucesso OU falha) enquanto o processo
            estiver de pé; ausência de dado aqui é "app não está rodando", coberto por
            custodia-app-down, não por esta regra. O custodia não é dono do
            plataforma-rabbitmq: se este alerta disparar, o primeiro passo é conferir o
            deploy/estado do hub-precos (quem sobe o broker) antes de investigar o
            próprio custodia. Os logs do RelayOutboxJob distinguem duas causas raiz
            diferentes: Outbox.PublicacaoRejeitada significa que o broker está VIVO e foi
            a FILA DESTINO quem rejeitou a publicação (nack do publisher confirm) — checar
            o x-max-length da fila e se algum consumidor de custodia.prices está parado,
            não o hub-precos; já Outbox.BrokerIndisponivel mantém o roteiro acima (broker
            fora do ar ou inalcançável, conferir o hub-precos).
        labels:
          severity: critical
          service: custodia
        isPaused: false
      - uid: custodia-db-readiness-down
        title: Custodia — DB/readiness down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __DS_PROM__
            model:
              expr: aspnetcore_healthcheck_status{job="custodia",name="AppDbContext"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: eq
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: ""
        panelId: 0
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: Health check do banco de dados (readiness) está falhando
          description: >-
            Mesma forma de td-db-readiness-down. noDataState=Alerting: a métrica
            aspnetcore_healthcheck_status só é publicada quando algo chama /health,
            /health/ready ou /health/live — em produção quem garante isso 24/7 é o
            healthcheck do próprio docker-compose.prod.yml (curl em /health/ready a cada
            30s), não o scrape do Alloy. Se a série sumir, o caminho mais provável é o
            processo do custodia ter parado de responder por completo (coberto também
            por custodia-app-down) ou o healthcheck do compose ter sido removido/quebrado
            — ausência aqui não pode ser lida como "banco ok". Verifique a
            connectivity com o Postgres compartilhado (host tesouro-direto-db) e os logs
            do container custodia-app para a exceção do AppDbContext antes de escalar.
        labels:
          severity: critical
          service: custodia
        isPaused: false
