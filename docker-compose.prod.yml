services:
  custodia:
    build: .
    container_name: custodia-app
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=${CUSTODIA_DB_HOST:-tesouro-direto-db};Port=5432;Database=${CUSTODIA_DB_NAME:-custodia};Username=custodia;Password=${CUSTODIA_APP_PASSWORD:?CUSTODIA_APP_PASSWORD e obrigatorio (senha da role custodia no Postgres compartilhado)}
      - ApiKey__Key=${CUSTODIA_API_KEY:?CUSTODIA_API_KEY e obrigatorio (chave que a custodia exige de quem le os extratos)}
      - Loki__Uri=${CUSTODIA_LOKI_URI:-http://alloy:3100}
      # F4: usuario e senha do broker `plataforma-rabbitmq`, consumidos pelo consumidor
      # de eventos (ARQUITETURA §9 item 3). O broker NAO sobe neste compose: e servico
      # da PLATAFORMA, provisionado pelo hub-precos; a custodia so entra na rede
      # "plataforma" e fala com o alias "plataforma-rabbitmq". Obrigatorias, sem
      # default: guest contra um broker real nao autentica, e cair pra ele em silencio
      # produz falha de runtime longe da causa. Precisam ser o MESMO valor
      # provisionado pelo hub-precos (e quem sobe o `plataforma-rabbitmq`).
      - RabbitMq__Host=plataforma-rabbitmq
      - RabbitMq__User=${RABBITMQ_USER:?RABBITMQ_USER e obrigatorio (usuario do broker plataforma-rabbitmq, provisionado pelo hub-precos)}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD e obrigatorio (senha do broker plataforma-rabbitmq)}
      # F6: bootstrap REST da projecao de precos (ARQUITETURA §7.1: popula preco_atual e
      # historico_precos via GET {Hub__BaseUrl}/v1/prices/asof quando a projecao esta
      # vazia ou atrasada) e o `asof` do worker de recalculo (§7.4). NAO cobre resolucao
      # nome->id do onboarding (§7.2): essa acontece em Operacoes, na borda
      # (ADR-10/ADR-11) — a Custodia so recebe instrumento_id ja resolvido, cru, no
      # evento trades.registered; a Custodia nao tem endpoint de escrita (ADR-10), entao
      # nao ha "validar instrumento" aqui. Sem default, de proposito: fora dos ambientes
      # isentos, HubConfigGuard (PADROES §6) derruba o boot se estiver ausente — e checa
      # comprimento minimo e placeholder na chave, nao so vazio.
      - Hub__BaseUrl=${CUSTODIA_HUB_BASE_URL:?CUSTODIA_HUB_BASE_URL e obrigatorio (URL do Hub de Precos)}
      - Hub__ApiKey=${CUSTODIA_HUB_API_KEY:?CUSTODIA_HUB_API_KEY e obrigatorio (chave que o custodia envia ao Hub)}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

    # LIMITES: MEDIDOS na VPS em 2026-09-07, nao herdados por copia.
    #   nproc = 1;  free -m -> total 1967 MB, disponivel 859 MB
    #   vizinhos hoje: tesouro-direto-app 256m, tesouro-direto-db 256m,
    #                  tesouro-direto-alloy 256m, tesouro-direto-web 160m,
    #                  hub-precos-rabbitmq 256m, operacoes-app 192m,
    #                  hub-precos-app SEM LIMITE (0) — e a lacuna da §10.12 aberta hoje:
    #                  o GC dele enxerga os 1,9 GB do host, nao um cgroup.
    # 192m e o mesmo teto do operacoes, que e o vizinho de perfil mais parecido (API
    # pequena, sem broker embutido). Nao e chute: e o numero do molde, e cabe nos 859 MB
    # disponiveis. Servico novo muda o teto dos VIZINHOS, nao so o seu (§10.14) — se a
    # custodia crescer (o worker de snapshots da §7.4 e o candidato), MECA de novo com
    # `docker stats` antes de subir este numero, e olhe o que sobra para os outros.
    # cpu_shares e PESO (vale sob contencao). O teto de cpus num host de UM nucleo nao
    # contem runaway nenhum, so corta rajada (§10.13) — por isso 1.0, e nao um numero
    # "folgado" inventado.
    cpu_shares: 512
    memswap_limit: 192m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 192m

    networks:
      tesouro-net:
      plataforma:
        aliases:
          # O nome vira ALIAS DNS na rede compartilhada, e colisao ja derrubou um
          # vizinho em producao (§10.1). OCUPADOS quando este arquivo foi escrito
          # (medido com `docker ps` na VPS em 2026-09-07):
          #   app, db, web, alloy, tesouro-direto-app, tesouro-direto-db,
          #   tesouro-direto-web, tesouro-direto-alloy, hub-precos-app,
          #   hub-precos-rabbitmq, operacoes-app, plataforma-rabbitmq.
          # `custodia-app` estava LIVRE — confirme com `docker ps` antes do primeiro
          # deploy, porque a lista envelhece.
          - custodia-app

networks:
  # Ambas external: nenhuma pertence a este servico. A tesouro-net e criada pelo
  # compose do tesouro-direto; a plataforma, pelo preflight do deploy.
  tesouro-net:
    external: true
  plataforma:
    external: true
